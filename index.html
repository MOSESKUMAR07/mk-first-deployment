
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MK | First Deployment</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #0f172a;
      color: #f8fafc;
      font-family: Arial, sans-serif;
      padding: 24px;
    }
    main {
      max-width: 600px;
      text-align: center;
      padding: 48px 28px;
      border: 1px solid #334155;
      border-radius: 24px;
      background: #1e293b;
    }
    h1 { font-size: 42px; }
    p { color: #cbd5e1; line-height: 1.7; }
    a {
      display: inline-block;
      margin-top: 16px;
      padding: 12px 20px;
      background: #38bdf8;
      color: #082f49;
      border-radius: 10px;
      text-decoration: none;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hey, I'm MK 👋</h1>
    <p>I'm learning how to build and deploy websites.</p>
    <p>This is my first website, published using GitHub and Vercel.</p>
    <a href="https://vercel.com">Explore Vercel</a>
  </main>
</body>
</html>
